# Dependabot configuration for Python dependency management
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      python-security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
      python-production:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "ly2xxx"
